openapi: 3.0.3
info:
  title: ''
  version: 0.0.0
paths:
  /api/register/:
    post:
      operationId: register_create
      description: Register a user
      tags:
      - register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistration'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistrationResponse'
          description: ''
        '400':
          description: No response body
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - ht
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/token/:
    post:
      operationId: token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/refresh/:
    post:
      operationId: token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/user/:
    get:
      operationId: user_retrieve
      description: Return logged in user
      tags:
      - user
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/wishlist/:
    get:
      operationId: wishlist_list
      description: Get entire wishlist
      tags:
      - wishlist
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WishlistItem'
          description: ''
    post:
      operationId: wishlist_create
      description: Create wishlist item
      tags:
      - wishlist
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishlistItem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WishlistItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WishlistItem'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistItemCreateResponse'
          description: ''
        '400':
          description: No response body
  /api/wishlist/{id}/:
    get:
      operationId: wishlist_retrieve
      description: Get wishlist item
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - wishlist
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistItem'
          description: ''
    patch:
      operationId: wishlist_partial_update
      description: Update a wishlist item
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - wishlist
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWishlistItem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWishlistItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWishlistItem'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistItem'
          description: ''
    delete:
      operationId: wishlist_destroy
      description: Delete a wishlist item
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - wishlist
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '404':
          description: No response body
components:
  schemas:
    NullEnum:
      enum:
      - null
    PatchedWishlistItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/StatusEnum'
          - $ref: '#/components/schemas/NullEnum'
        product:
          type: integer
          nullable: true
        name:
          type: string
          maxLength: 1000
        brand:
          type: string
          maxLength: 100
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        desc:
          type: string
          maxLength: 1000
        url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        image:
          type: string
          format: uri
          nullable: true
        days_to_wait:
          type: integer
          default: 7
        ready_date:
          type: string
          format: date
          readOnly: true
        days_remaining:
          type: integer
          readOnly: true
        currency:
          type: string
          maxLength: 3
    StatusEnum:
      enum:
      - BOUGHT
      - RESISTED
      type: string
      description: |-
        * `BOUGHT` - Bought
        * `RESISTED` - Resisted
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        profile_pic:
          type: string
          format: uri
          nullable: true
        bio:
          type: string
          maxLength: 100
        default_currency:
          type: string
          maxLength: 3
      required:
      - id
      - username
    UserRegistration:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - password
      - username
    UserRegistrationResponse:
      type: object
      properties:
        id:
          type: integer
      required:
      - id
    WishlistItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/StatusEnum'
          - $ref: '#/components/schemas/NullEnum'
        product:
          type: integer
          nullable: true
        name:
          type: string
          maxLength: 1000
        brand:
          type: string
          maxLength: 100
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        desc:
          type: string
          maxLength: 1000
        url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        image:
          type: string
          format: uri
          nullable: true
        days_to_wait:
          type: integer
          default: 7
        ready_date:
          type: string
          format: date
          readOnly: true
        days_remaining:
          type: integer
          readOnly: true
        currency:
          type: string
          maxLength: 3
      required:
      - days_remaining
      - id
      - name
      - ready_date
      - status
    WishlistItemCreateResponse:
      type: object
      properties:
        id:
          type: integer
      required:
      - id
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
